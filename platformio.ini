; PlatformIO Project Configuration File
; Radio Alarm Clock — Makerfabs MaTouch ESP32-S3 Parallel TFT 4.3" V3.1
;
; Package versions match the working Radiowecker_EEZ_AI reference project on
; the same hardware: espressif32 5.4.0 / arduino-esp32 2.0.17 / LovyanGFX 1.2.7.
; This combination has been verified glitch-free for ST7262 RGB output;
; later upstream versions exhibit a per-second horizontal shift on this panel.

[platformio]
default_envs = matouch43

[env:matouch43]
platform          = espressif32 @ 5.4.0
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.17
board             = esp32-s3-devkitc-1
framework         = arduino

; Hardware: 16 MB QIO flash + 8 MB Octal PSRAM (R8 variant of the DevKitC-1).
board_build.arduino.memory_type    = qio_opi
board_build.psram_type             = opi
board_upload.flash_size            = 16MB
board_build.partitions             = partitions.csv
board_build.loop_task_stack_size   = 16384
board_build.arduino.upstream_packages = no

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; Upload
upload_speed    = 921600

; Build flags
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    -D CORE_DEBUG_LEVEL=1
    ; Route Serial to native USB CDC (same port used for uploading)
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

    ; Make include/ visible to LVGL/LovyanGFX configuration headers
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LGFX_USE_V1

; Libraries — versions pinned to the EEZ reference project
lib_deps =
    ; Display driver + touch
    lovyan03/LovyanGFX @ 1.2.7

    ; UI framework
    lvgl/lvgl @ 9.2.2

    ; JSON for config files
    bblanchon/ArduinoJson @ ^7.0.0

    ; Environmental sensors (Mabee I2C)
    adafruit/Adafruit SGP30 Sensor @ ^2.0.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BusIO @ ^1.16.1

; LovyanGFX needs access to source files (not just headers)
lib_archive = no

; Pre-build scripts
;   - patch_lvgl.py stubs out ARM-only assembly files (Helium/NEON) that
;     break Xtensa builds. Required for LVGL 9.2.2 on ESP32-S3.
extra_scripts =
    pre:scripts/patch_lvgl.py
