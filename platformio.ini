; PlatformIO Project Configuration File
; Radio Alarm Clock — Makerfabs MaTouch ESP32-S3 Parallel TFT 4.3" V3.1

[platformio]
default_envs = matouch43

[env:matouch43]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-s3-devkitc1-n16r8
framework = arduino

; Board already declares 16 MB QIO flash + 8 MB OPI PSRAM + BOARD_HAS_PSRAM.
; Only override partitions (custom layout) and flash size (belt-and-suspenders).
board_build.flash_size              = 16MB
board_build.partitions              = partitions.csv

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; Upload
upload_speed    = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Route Serial to native USB CDC (same port used for uploading)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Explicitly add include/ to the global search path so LVGL finds lv_conf.h
    -I include
    ; LVGL — pick up lv_conf.h from include/
    -DLV_CONF_INCLUDE_SIMPLE
    ; LovyanGFX
    -DLGFX_USE_V1

; Libraries
lib_deps =
    ; Display driver + touch
    lovyan03/LovyanGFX @ ^1.2.21

    ; UI framework — pin to 9.2.2; 9.5.0 ships ARM Helium .S files that break Xtensa assembler
    lvgl/lvgl @ 9.2.2

    ; Internet radio / I2S audio (ESP8266Audio works on ESP32-S3)
    earlephilhower/ESP8266Audio @ ^1.9.7

    ; JSON for config files
    bblanchon/ArduinoJson @ ^7.0.0

    ; Environmental sensors (Mabee I2C)
    adafruit/Adafruit SGP30 Sensor @ ^2.0.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BusIO @ ^1.16.1

; LovyanGFX needs access to source files (not just headers)
lib_archive = no

; Pre-build scripts
extra_scripts =
    pre:scripts/patch_lvgl.py
    pre:scripts/patch_esp8266audio.py
    pre:scripts/patch_lgfx.py
