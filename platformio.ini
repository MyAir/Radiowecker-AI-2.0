; PlatformIO Project Configuration File
; Radio Alarm Clock — Makerfabs MaTouch ESP32-S3 Parallel TFT 4.3" V3.1
;
; Package versions match the working Radiowecker_EEZ_AI reference project on
; the same hardware: espressif32 5.4.0 / arduino-esp32 2.0.17 / LovyanGFX 1.2.7.
; This combination has been verified glitch-free for ST7262 RGB output;
; later upstream versions exhibit a per-second horizontal shift on this panel.

[platformio]
default_envs = matouch43

[env:matouch43]
platform          = espressif32 @ 5.4.0
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.17
board             = esp32-s3-devkitc-1
framework         = arduino

; Hardware: 16 MB QIO flash + 8 MB Octal PSRAM (R8 variant of the DevKitC-1).
board_build.arduino.memory_type    = qio_opi
board_build.psram_type             = opi
board_upload.flash_size            = 16MB
board_build.partitions             = partitions.csv
board_build.loop_task_stack_size   = 16384
board_build.arduino.upstream_packages = no

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; Upload
upload_speed    = 921600

; Build flags
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    -D CORE_DEBUG_LEVEL=1
    ; Serial monitor goes over UART0 (CP2104 USB-to-UART port).
    ; Native USB CDC MUST be off because I2S audio outputs on GPIO 19/20
    ; (USB D-/D+) — if the native USB peripheral keeps those pins, the
    ; I2S DMA never drains and the audio task blocks in i2s_write until
    ; the task watchdog fires. Comments-out alone aren't enough: the
    ; arduino-esp32 board JSON for esp32-s3-devkitc-1 enables CDC by
    ; default, so we force the zeros here.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0

    ; Make include/ visible to LVGL/LovyanGFX configuration headers
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LGFX_USE_V1

; Libraries — versions pinned to the EEZ reference project
lib_deps =
    ; Display driver + touch
    lovyan03/LovyanGFX @ 1.2.7

    ; UI framework
    lvgl/lvgl @ 9.2.2

    ; JSON for config files
    bblanchon/ArduinoJson @ ^7.0.0

    ; Environmental sensors (Mabee I2C)
    adafruit/Adafruit SGP30 Sensor @ ^2.0.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BusIO @ ^1.16.1

    ; Audio (MP3 from SD + ICY/MP3 web stream over I2S)
    earlephilhower/ESP8266Audio @ ^1.9.9

; LovyanGFX needs access to source files (not just headers)
lib_archive = no

; Pre-build scripts
;   - patch_lvgl.py stubs out ARM-only assembly files (Helium/NEON) that
;     break Xtensa builds. Required for LVGL 9.2.2 on ESP32-S3.
;   - patch_esp8266audio.py stubs out the SPIFFS-using sources in
;     ESP8266Audio. Our include/SPIFFS.h is only a shim (no SPIFFS object),
;     so the stock AudioFileSourceFS.cpp and AudioOutputSPIFFSWAV.cpp don't
;     compile against it. Both files are unused in this project.
extra_scripts =
    pre:scripts/patch_lvgl.py
    pre:scripts/patch_esp8266audio.py

; ---------------------------------------------------------------------------
; OTA upload environment.
; Build with the default `matouch43` env (USB serial). To upload over WiFi
; instead, use:
;     pio run -e matouch43_ota -t upload
; The device must be on the same network and reachable as radiowecker2.local
; (mDNS). If name resolution fails, override with:
;     pio run -e matouch43_ota -t upload --upload-port 192.168.x.y
; ---------------------------------------------------------------------------
[env:matouch43_ota]
extends         = env:matouch43
upload_protocol = espota
upload_port     = radiowecker2.local
; upload_flags  = --auth=changeme   ; uncomment if ArduinoOTA.setPassword() is enabled
